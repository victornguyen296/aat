<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Báo giá AusAsia</title>
<style>
:root{--gold:#d9a400;--blue:#1f6aa5;--ink:#1b3a57;--line:#b9c9dc;--bg:#eef2f6}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font:13px/1.4 "Segoe UI",Roboto,Arial,sans-serif;color:var(--ink)}
.bar{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);padding:8px 14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bar button,.bar input{font:inherit;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink)}
.bar button{cursor:pointer}.bar button:hover{background:#e6eef7}
.bar button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.bar .pdf{background:var(--gold);border-color:var(--gold);color:#fff;font-weight:600;margin-left:auto}
.bar input{width:120px}.bar .seq{width:50px}
.page{background:#fff;max-width:1100px;margin:16px auto;padding:30px 36px;box-shadow:0 1px 6px #0002}
.hd{display:flex;justify-content:space-between;gap:20px;border-bottom:8px solid var(--gold);padding-bottom:10px}
.co{display:flex;flex-direction:column;gap:3px}.co small{line-height:1.5}
.gold{color:var(--gold)}
h1{margin:0;font-size:26px;color:var(--gold);letter-spacing:.5px}
.qt{text-align:right}.po{color:#8fb3d6;font-size:15px;margin:2px 0 8px;word-break:break-all}
.meta td{padding:1px 4px}.meta td:first-child{font-weight:700;text-align:right}
.cus{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;padding:12px 0;border-bottom:8px solid var(--gold);align-items:center}
.cus b{font-size:12px}
input.f,textarea.f{width:100%;font:inherit;color:inherit;border:0;border-bottom:1px dashed var(--line);padding:2px 4px;background:#f8fbff;resize:none}
.optl{margin:12px 0 4px;font-weight:700;color:var(--blue)}
table.t{width:100%;border-collapse:collapse;margin-top:8px}
.t th{background:var(--blue);color:#fff;padding:6px 4px;font-size:12px}
.t td{border:1px solid var(--line);padding:4px 5px;vertical-align:top;white-space:pre-wrap}
.t tr:nth-child(even) td{background:#f4f8fc}
.t td[contenteditable]:focus{outline:2px solid var(--gold);background:#fffbe8}
.c{text-align:center}.r{text-align:right}
.x{border:0!important;background:none!important;text-align:center;cursor:pointer;color:#c33;width:24px}
.add{margin:8px 0;padding:6px 14px;border:1px dashed var(--blue);background:#fff;color:var(--blue);border-radius:6px;cursor:pointer;font-size:16px}
.bottom{display:flex;justify-content:space-between;gap:20px;border-top:8px solid var(--gold);margin-top:6px;padding-top:8px}
.note{font-style:italic;font-weight:600;font-family:Georgia,serif}
.sum{min-width:300px}.sum div{display:flex;justify-content:space-between;gap:20px;padding:1px 0;font-weight:700}
.sum input{width:44px;text-align:right;border:0;border-bottom:1px dashed var(--line);font:inherit;color:inherit}
.terms{border-top:8px solid var(--gold);margin-top:14px;padding-top:8px}.terms h4{margin:0 0 4px;color:var(--gold);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;margin-top:14px}
.card{border:1px solid var(--line);border-radius:8px;padding:12px}.card.best{border:2px solid var(--gold)}
.card h3{margin:0 0 6px;color:var(--blue)}.card table{width:100%;border-collapse:collapse}
.card td{padding:3px 0;border-bottom:1px solid #e3ebf3;vertical-align:top}
.card .tot{display:flex;justify-content:space-between;font-weight:700;padding-top:3px}
.nt{margin-top:8px;min-height:40px;border:1px dashed var(--line);padding:4px;white-space:pre-wrap}
.nt:empty:before{content:attr(data-ph);color:#9ab}
@page{size:A4;margin:10mm}
@media print{
 body{background:#fff}.no-print,.bar,.add,.x{display:none!important}
 .page{box-shadow:none;margin:0;padding:0;max-width:none}
 input.f{border:0;background:none;padding:0}.sum input{border:0}
 .nt{border:0}.nt:empty{display:none}
 .t td[contenteditable]{background:none!important}
 *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<div class="bar">
 <span id="tabs"></span>
 <span class="no-print"><input id="oname" placeholder="Tên option"></span>
 <button data-a="new">+ Option</button><button data-a="dup">Nhân bản</button><button data-a="delo">Xóa option</button>
 <label>STT <input class="seq" id="seq"></label>
 <button data-a="reset">Làm mới</button>
 <button class="pdf" data-a="pdf">Xuất PDF</button>
</div>
<div id="app"></div>
<script>
const KEY='aatq-v1',$=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0'),fmt=n=>Math.round(n||0).toLocaleString('en-US');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=new Date(),plus=new Date(today.getTime()+15*864e5);
const dmy=d=>pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear();
const ddmmyy=d=>pad(d.getDate())+pad(d.getMonth()+1)+String(d.getFullYear()).slice(2);
const blank=()=>({n:'',d:'',b:'',s:'Sẵn hàng',u:'Cái',q:1,p:0});
const init=()=>({company:'',seq:'01',to:'',email:'',phone:'',addr:'',note:'',vat:8,cur:0,opts:[{name:'Option 1',note:'',rows:[blank()]}]});
let S;try{S=JSON.parse(localStorage.getItem(KEY))||init()}catch(e){S=init()}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const po=()=>`AATQ-[${S.company}][${ddmmyy(today)}][${S.seq}]`;
const calc=o=>{const s=o.rows.reduce((a,r)=>a+r.q*r.p,0),v=Math.round(s*S.vat/100);return{s,v,t:s+v}};
const LOGO='<svg width="150" height="44" viewBox="0 0 150 44"><path d="M4 40 22 6l18 34h-8L22 20 12 40z" fill="#1f6aa5"/><path d="M14 40 28 14l5 9-9 17z" fill="#d9a400"/><text x="46" y="27" font-size="17" font-family="Arial" fill="#1f6aa5" letter-spacing="2">AUS<tspan fill="#d9a400">ASIA</tspan></text><text x="47" y="38" font-size="7" font-family="Arial" fill="#1f6aa5" letter-spacing="2">TECHNOLOGIES</text></svg>';

function tabs(){
 $('#tabs').innerHTML=S.opts.map((o,i)=>`<button data-a="tab" data-i="${i}" class="${S.cur==i?'on':''}">${esc(o.name||'Option '+(i+1))}</button>`).join(' ')+` <button data-a="cmp" class="${S.cur<0?'on':''}">So sánh</button>`;
}
function quote(){
 const o=S.opts[S.cur],f=(k,ph='')=>`<input class="f" data-f="${k}" value="${esc(S[k])}" placeholder="${ph}">`;
 return `<div class="page">
 <div class="hd"><div class="co">${LOGO}<b class="gold">Công ty cổ phần Ausasia Technologies</b><small>60 Đường N3A, The Global City<br>Phường An Khánh, TP Hồ Chí Minh<br>www.ausasiatechnologies.com</small></div>
 <div class="qt"><h1>QUOTATION</h1><div class="po" id="po"></div>
 <table class="meta" align="right"><tr><td>Soạn thảo bởi:</td><td>Đặng Hương Giang</td></tr><tr><td>Liên lạc:</td><td>sales@ausasiatechnologies.com</td></tr><tr><td>Ngày tạo:</td><td>${dmy(today)}</td></tr><tr><td>Hiệu lực đến:</td><td>${dmy(plus)}</td></tr></table></div></div>
 <div class="cus"><b>Công ty:</b>${f('company','Tên công ty (dùng cho mã PO)')}<b>Kính gửi:</b>${f('to','Tên khách hàng')}<b>Email:</b>${f('email')}<b>SĐT:</b>${f('phone')}<b>Địa chỉ:</b>${f('addr')}<b>Ghi chú:</b>${f('note')}</div>
 ${S.opts.length>1?`<div class="optl" id="optl">${esc(o.name)}</div>`:''}
 <table class="t"><tr><th>STT</th><th>Tên sản phẩm</th><th>Mô tả sản phẩm</th><th>Hãng sản xuất</th><th>Tình trạng</th><th>ĐVT</th><th>SL</th><th>Đơn giá (VND)</th><th>Thành tiền (VND)</th><th class="no-print"></th></tr>
 ${o.rows.map((r,i)=>{const c=(k,cls='')=>`<td class="${cls}" contenteditable data-r="${i}" data-k="${k}">${esc(k=='q'||k=='p'?fmt(r[k]):r[k])}</td>`;
 return `<tr><td class="c">${i+1}</td>${c('n')}${c('d')}${c('b','c')}${c('s','c')}${c('u','c')}${c('q','c')}${c('p','r')}<td class="r" id="t${i}"></td><td class="x no-print" data-a="delr" data-i="${i}">✕</td></tr>`}).join('')}</table>
 <button class="add" data-a="addr" title="Thêm dòng">+</button>
 <div class="bottom"><div class="note">AusAsia Technologies hỗ trợ miễn phí chi phí giao hàng.<br>Các vấn đề phát sinh có thể liên hệ trực tiếp với Sale để được hỗ trợ</div>
 <div class="sum"><div><span>Tổng Cộng</span><span>VND <span id="sub"></span></span></div><div><span>VAT <input data-f="vat" type="number" value="${S.vat}">%</span><span>VND <span id="vat"></span></span></div><div><span>Tổng cộng (đã bao gồm VAT)</span><span>VND <span id="tot"></span></span></div></div></div>
 <div class="terms"><h4>ĐIỀU KHOẢN VÀ ĐIỀU KIỆN</h4>1. Báo giá này có giá trị trong vòng: 15 ngày<br>2. Giá được niêm yết bằng VND.<br>3. Điều khoản thanh toán: Thanh toán trong vòng 10 ngày kể từ ngày lập hóa đơn.<br>4. Thời gian tính cước kể từ ngày nhận bàn giao vị trí văn phòng cần quản lý.<br>5. Thời hạn hợp đồng: 12 tháng kể từ ngày ký.</div></div>`;
}
function cmp(){
 const cs=S.opts.map(calc),min=Math.min(...cs.map(c=>c.t));
 return `<div class="page"><div class="hd"><div class="co">${LOGO}</div><div class="qt"><h1>SO SÁNH BÁO GIÁ</h1><div class="po" id="po"></div><div>${esc(S.company||S.to)} · ${dmy(today)}</div></div></div>
 <div class="grid">${S.opts.map((o,i)=>`<div class="card ${S.opts.length>1&&cs[i].t==min?'best':''}"><h3>${esc(o.name)}</h3>
 <table>${o.rows.filter(r=>r.n).map(r=>`<tr><td>${esc(r.n)}${r.b?` <small>(${esc(r.b)})</small>`:''}<br><small>${fmt(r.q)} × ${fmt(r.p)}</small></td><td class="r">${fmt(r.q*r.p)}</td></tr>`).join('')}</table>
 <div class="tot"><span>Chưa VAT</span><span>${fmt(cs[i].s)}</span></div><div class="tot"><span>VAT ${S.vat}%</span><span>${fmt(cs[i].v)}</span></div>
 <div class="tot gold"><span>Tổng cộng (VND)</span><span>${fmt(cs[i].t)}</span></div>
 <div class="tot"><span>So với thấp nhất</span><span>${cs[i].t==min?'Thấp nhất':'+'+fmt(cs[i].t-min)}</span></div>
 <div class="nt" contenteditable data-on="${i}" data-ph="Nhận xét / ưu nhược điểm...">${esc(o.note)}</div></div>`).join('')}</div></div>`;
}
function render(){
 $('#app').innerHTML=S.cur<0?cmp():quote();tabs();
 $('#seq').value=S.seq;$('#oname').value=S.cur<0?'':S.opts[S.cur].name;$('#oname').disabled=S.cur<0;upd();
}
function upd(){
 const p=$('#po');if(p)p.textContent=po();
 const o=S.opts[S.cur];
 if(o){o.rows.forEach((r,i)=>{const e=$('#t'+i);if(e)e.textContent=fmt(r.q*r.p)});const c=calc(o);
 $('#sub').textContent=fmt(c.s);$('#vat').textContent=fmt(c.v);$('#tot').textContent=fmt(c.t)}
 save();
}
document.addEventListener('input',e=>{
 const t=e.target,d=t.dataset;
 if(t.id=='seq')S.seq=t.value;
 else if(t.id=='oname'){S.opts[S.cur].name=t.value;tabs();const l=$('#optl');if(l)l.textContent=t.value}
 else if(d.f)S[d.f]=d.f=='vat'?(parseFloat(t.value)||0):t.value;
 else if(d.k){const r=S.opts[S.cur].rows[+d.r],v=t.textContent;r[d.k]=(d.k=='q'||d.k=='p')?(parseFloat(v.replace(/[^\d.]/g,''))||0):v}
 else if(d.on!==undefined)S.opts[+d.on].note=t.textContent;
 upd();
});
document.addEventListener('focusout',e=>{const d=e.target.dataset;if(d.k=='q'||d.k=='p')e.target.textContent=fmt(S.opts[S.cur].rows[+d.r][d.k])});
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,i=+b.dataset.i,o=S.opts[S.cur];
 if(a=='tab')S.cur=i;
 else if(a=='cmp')S.cur=-1;
 else if(a=='addr'){o.rows.push(blank())}
 else if(a=='delr'){o.rows.splice(i,1);if(!o.rows.length)o.rows.push(blank())}
 else if(a=='new'){S.opts.push({name:'Option '+(S.opts.length+1),note:'',rows:[blank()]});S.cur=S.opts.length-1}
 else if(a=='dup'){if(!o)return;S.opts.push(JSON.parse(JSON.stringify({...o,name:o.name+' (copy)'})));S.cur=S.opts.length-1}
 else if(a=='delo'){if(!o||S.opts.length<2||!confirm('Xóa '+o.name+'?'))return;S.opts.splice(S.cur,1);S.cur=0}
 else if(a=='reset'){if(!confirm('Xóa toàn bộ dữ liệu và tạo báo giá mới?'))return;S=init()}
 else if(a=='pdf'){const t=document.title;document.title=S.cur<0?'So sanh bao gia '+S.company:po();window.print();document.title=t;return}
 render();
});
render();
</script>
</body>
</html>
